name: Deploy to Live
run-name: "Deploy ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / image tag to deploy"
        required: true
        type: string
      change_request_id:
        description: "Change Request ID (optional)"
        required: false
        type: string
      confirm_production_deploy:
        description: "Type CONFIRM to deploy to live"
        required: true
        type: string
      deploy_gcp_live:
        description: "Deploy to GCP Live"
        required: false
        type: boolean
        default: false
      deploy_gb1_live:
        description: "Deploy to GB1 Live"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/thg-stock-availability/druid
  HELM_VERSION: "3.12.0"
  KUBECTL_VERSION: "1.28.0"
  CHARTS_REPO: THG-Stock-Availability/druid-helm-template
  CHARTS_REF: add-GCP-Clusters

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.deploy_gcp_live }}" == "false" && "${{ inputs.deploy_gb1_live }}" == "false" ]]; then
            echo "❌ At least one environment must be selected"
            exit 1
          fi

          if [[ "${{ inputs.confirm_production_deploy }}" != "CONFIRM" ]]; then
            echo "❌ You must type CONFIRM to deploy to live"
            exit 1
          fi

          CR_ID="${{ inputs.change_request_id }}"
          if [[ -z "$CR_ID" ]]; then
            CR_ID="N/A"
          fi

          echo "Version: ${{ inputs.version }}"
          echo "Change Request: $CR_ID"
          echo "Deploy GCP Live: ${{ inputs.deploy_gcp_live }}"
          echo "Deploy GB1 Live: ${{ inputs.deploy_gb1_live }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GRGIT_USER }}
          password: ${{ secrets.GRGIT_PASS }}

      - name: Verify image exists
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.IMAGE_REPO }}:${{ inputs.version }}"
          docker manifest inspect "${IMAGE_REF}" > /dev/null 2>&1 || {
            echo "❌ Image not found: ${IMAGE_REF}"
            exit 1
          }
          echo "✅ Found image: ${IMAGE_REF}"

  gcp-approval:
    name: GCP Live - Approval
    if: inputs.deploy_gcp_live == true
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment: gcp-live
    continue-on-error: true
    outputs:
      approved: ${{ steps.approved.outputs.approved }}
    steps:
      - name: Waiting for approval
        shell: bash
        run: |
          echo "Waiting for approval for gcp-live"
          echo "Cluster: euw2-li-beunity"
          echo "Namespace: druid"
          echo "Release: druid-live"
          echo "Version: ${{ inputs.version }}"

      - name: Approved
        id: approved
        shell: bash
        run: echo "approved=true" >> "$GITHUB_OUTPUT"

  deploy-gcp-live:
    name: GCP Live - Deploy
    if: inputs.deploy_gcp_live == true && needs.gcp-approval.outputs.approved == 'true'
    needs: [validate-inputs, gcp-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gcp-live
    env:
      CLUSTER: euw2-li-beunity
      NAMESPACE: druid
      RELEASE_NAME: druid-live
      CHART_PATH: charts-repo/druid/gcp
      IMAGE_REF: ghcr.io/thg-stock-availability/druid:${{ inputs.version }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout Unity Charts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHARTS_REPO }}
          ref: ${{ env.CHARTS_REF }}
          path: charts-repo
          token: ${{ secrets.GRGIT_PASS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail
          echo -n "${{ secrets.GCP_LI_CLUSTER_CA }}" | base64 -d > /tmp/ca.crt

          kubectl config set-cluster "${{ env.CLUSTER }}" \
            --server="${{ secrets.GKE_LI_CLUSTER_SERVER }}" \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true

          kubectl config set-credentials deployer \
            --token="${{ secrets.GCP_LI_DEPLOY_TOKEN }}"

          kubectl config set-context "${{ env.CLUSTER }}" \
            --cluster="${{ env.CLUSTER }}" \
            --user=deployer \
            --namespace="${{ env.NAMESPACE }}"

          kubectl config use-context "${{ env.CLUSTER }}"

      - name: Verify cluster connectivity
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "${{ env.NAMESPACE }}"

      - name: Validate chart
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"

          cd "${{ env.CHART_PATH }}"

          helm lint .

          helm template "${{ env.RELEASE_NAME }}" . \
            --namespace "${{ env.NAMESPACE }}" \
            --values values.yaml \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            > /tmp/druid-gcp.yaml

          kubectl apply --dry-run=server -f /tmp/druid-gcp.yaml

      - name: Deploy with Helm
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"

          cd "${{ env.CHART_PATH }}"

          helm upgrade --install "${{ env.RELEASE_NAME }}" . \
            --namespace "${{ env.NAMESPACE }}" \
            --values values.yaml \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --atomic \
            --timeout 1200s

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployments -n "${{ env.NAMESPACE }}"
          kubectl get statefulsets -n "${{ env.NAMESPACE }}"
          kubectl get pods -n "${{ env.NAMESPACE }}"

          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-broker -n "${{ env.NAMESPACE }}" --timeout=1200s || true
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-coordinator -n "${{ env.NAMESPACE }}" --timeout=1200s || true
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-router -n "${{ env.NAMESPACE }}" --timeout=1200s || true

      - name: Generate deployment summary
        if: always()
        shell: bash
        run: |
          CR_ID="${{ inputs.change_request_id }}"
          if [[ -z "$CR_ID" ]]; then
            CR_ID="N/A"
          fi

          {
            echo "## GCP Live Deployment Summary"
            echo "- Environment: gcp-live"
            echo "- Cluster: ${{ env.CLUSTER }}"
            echo "- Namespace: ${{ env.NAMESPACE }}"
            echo "- Release: ${{ env.RELEASE_NAME }}"
            echo "- Version: ${{ inputs.version }}"
            echo "- Image: \`${{ env.IMAGE_REF }}\`"
            echo "- Chart Repo: ${{ env.CHARTS_REPO }}"
            echo "- Chart Ref: ${{ env.CHARTS_REF }}"
            echo "- Chart Path: druid/gcp"
            echo "- Change Request: ${CR_ID}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  gb1-approval:
    name: GB1 Live - Approval
    if: inputs.deploy_gb1_live == true
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment: gb1-live
    continue-on-error: true
    outputs:
      approved: ${{ steps.approved.outputs.approved }}
    steps:
      - name: Waiting for approval
        shell: bash
        run: |
          echo "Waiting for approval for gb1-live"
          echo "Cluster: gb1-li-beunityv3"
          echo "Namespace: druid"
          echo "Release: druid"
          echo "Version: ${{ inputs.version }}"

      - name: Approved
        id: approved
        shell: bash
        run: echo "approved=true" >> "$GITHUB_OUTPUT"

  deploy-gb1-live:
    name: GB1 Live - Deploy
    if: inputs.deploy_gb1_live == true && needs.gb1-approval.outputs.approved == 'true'
    needs: [validate-inputs, gb1-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gb1-live
    env:
      CLUSTER: gb1-li-beunityv3
      NAMESPACE: druid
      RELEASE_NAME: druid
      CHART_PATH: charts-repo/druid/onprem
      IMAGE_REF: ghcr.io/thg-stock-availability/druid:${{ inputs.version }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout Unity Charts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHARTS_REPO }}
          ref: ${{ env.CHARTS_REF }}
          path: charts-repo
          token: ${{ secrets.GRGIT_PASS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail
          echo -n "${{ secrets.GB1_CLUSTER_CA }}" | base64 -d > /tmp/ca.crt

          kubectl config set-cluster "${{ env.CLUSTER }}" \
            --server="${{ secrets.GB1_CLUSTER_SERVER }}" \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true

          kubectl config set-credentials deployer \
            --token="${{ secrets.GB1_DEPLOY_TOKEN }}"

          kubectl config set-context "${{ env.CLUSTER }}" \
            --cluster="${{ env.CLUSTER }}" \
            --user=deployer \
            --namespace="${{ env.NAMESPACE }}"

          kubectl config use-context "${{ env.CLUSTER }}"

      - name: Verify cluster connectivity
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "${{ env.NAMESPACE }}"

      - name: Validate chart
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"

          cd "${{ env.CHART_PATH }}"

          helm lint .

          helm template "${{ env.RELEASE_NAME }}" . \
            --namespace "${{ env.NAMESPACE }}" \
            --values values.yaml \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            > /tmp/druid-gb1.yaml

          kubectl apply --dry-run=server -f /tmp/druid-gb1.yaml

      - name: Deploy with Helm
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"

          cd "${{ env.CHART_PATH }}"

          helm upgrade --install "${{ env.RELEASE_NAME }}" . \
            --namespace "${{ env.NAMESPACE }}" \
            --values values.yaml \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --atomic \
            --timeout 1200s

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployments -n "${{ env.NAMESPACE }}"
          kubectl get statefulsets -n "${{ env.NAMESPACE }}"
          kubectl get pods -n "${{ env.NAMESPACE }}"

          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-broker -n "${{ env.NAMESPACE }}" --timeout=1200s || true
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-coordinator -n "${{ env.NAMESPACE }}" --timeout=1200s || true
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-router -n "${{ env.NAMESPACE }}" --timeout=1200s || true

      - name: Generate deployment summary
        if: always()
        shell: bash
        run: |
          CR_ID="${{ inputs.change_request_id }}"
          if [[ -z "$CR_ID" ]]; then
            CR_ID="N/A"
          fi

          {
            echo "## GB1 Live Deployment Summary"
            echo "- Environment: gb1-live"
            echo "- Cluster: ${{ env.CLUSTER }}"
            echo "- Namespace: ${{ env.NAMESPACE }}"
            echo "- Release: ${{ env.RELEASE_NAME }}"
            echo "- Version: ${{ inputs.version }}"
            echo "- Image: \`${{ env.IMAGE_REF }}\`"
            echo "- Chart Repo: ${{ env.CHARTS_REPO }}"
            echo "- Chart Ref: ${{ env.CHARTS_REF }}"
            echo "- Chart Path: druid/onprem"
            echo "- Change Request: ${CR_ID}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"